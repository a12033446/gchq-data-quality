- description: Calculate average string length for emails
  inputs:
    df:
      email: ["a@b.co", "user@example.com", "test@test.com", "hello@"]
    field: email
  expected:
    metric_value: 10.25
    records_evaluated: 4
    pass_rate: null

- description: Calculate average string length with some short emails
  inputs:
    df:
      email: ["a@b.co", "user@example.com", "x", "test@test.com", "ab"]
    field: email
  expected:
    metric_value: 7.6
    records_evaluated: 5
    pass_rate: null

- description: Calculate average string length for long emails
  inputs:
    df:
      email: ["user@example.com", "admin@company.co.uk", "test@production.io"]
    field: email
  expected:
    metric_value: 17.666666666666668
    records_evaluated: 3
    pass_rate: null

- description: Calculate average string length for codes
  inputs:
    df:
      code: ["ABC", "ABCD", "ABCDE", "ABCDEF", "ABCDEFGH"]
    field: code
  expected:
    metric_value: 5.2
    records_evaluated: 5
    pass_rate: null

- description: Calculate average string length for short texts
  inputs:
    df:
      text: ["a", "ab", "abc", "abcd"]
    field: text
  expected:
    metric_value: 2.5
    records_evaluated: 4
    pass_rate: null

- description: Calculate average string length with one long text
  inputs:
    df:
      text: ["a", "ab", "abc", "abcdefghijk"]
    field: text
  expected:
    metric_value: 4.25
    records_evaluated: 4
    pass_rate: null

- description: Null values are skipped in average calculation
  inputs:
    df:
      email: ["a@b.co", "user@example.com", null, "x", null]
    field: email
  expected:
    metric_value: 7.666666666666667
    records_evaluated: 3
    pass_rate: null

- description: All values are null, no records evaluated
  inputs:
    df:
      email: [null, null, null]
    field: email
  expected:
    metric_value: null
    records_evaluated: 0
    pass_rate: null

- description: Numeric values are coerced to strings for length calculation
  inputs:
    df:
      numeric_id: [1, 22, 333, 4444]
    field: numeric_id
  expected:
    metric_value: 2.5
    records_evaluated: 4
    pass_rate: null

- description: Empty strings have zero length
  inputs:
    df:
      field: ["", "a", "ab"]
    field: field
  expected:
    metric_value: 1.0
    records_evaluated: 3
    pass_rate: null
